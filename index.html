<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friend Group Brawl</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <section id="menu" class="screen">
      <h1>Friend Group <span>Brawl</span></h1>
      <div id="slots" class="slots"></div>
      <div class="menu-row">
        <label>Stocks
          <select id="stocks">
            <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option>
          </select>
        </label>
        <button id="start" class="primary">Fight!</button>
      </div>
      <p id="menu-hint" class="hint"></p>
      <details class="controls">
        <summary>Controls</summary>
        <ul id="control-list"></ul>
        <p>Attack/special + a direction picks the move. Up + special is your recovery. Down on a floating platform drops through it. Esc or Start pauses.</p>
      </details>
    </section>

    <section id="pause" class="screen overlay hidden">
      <h2>Paused</h2>
      <button id="resume" class="primary">Resume</button>
      <button id="quit">Quit to menu</button>
    </section>

    <section id="results" class="screen overlay hidden">
      <h2 id="winner"></h2>
      <table id="standings"></table>
      <div class="menu-row">
        <button id="rematch" class="primary">Rematch</button>
        <button id="to-menu">Menu</button>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
